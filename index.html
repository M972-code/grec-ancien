<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Révision grec ancien</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
    }

    .question {
      margin: 30px 0 16px;
      font-size: 28px;
      font-weight: 600;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 22px;
      border-radius: 12px;
      border: 1px solid #ccc;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      margin-bottom: 10px;
    }

    button.secondary {
      background: #e5e5ea;
      color: #111;
    }

    .feedback {
      margin-top: 18px;
      font-size: 18px;
      line-height: 1.5;
    }

    .correct {
      color: #16803c;
      font-weight: 600;
    }

    .wrong {
      color: #b42318;
      font-weight: 600;
    }

    .stats {
      margin-top: 24px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>Révision grec ancien</h1>

    <div class="question" id="question"></div>

    <input
      id="answer"
      type="text"
      placeholder="Ta réponse en grec"
      autocomplete="off"
      autocapitalize="none"
    />

    <button onclick="checkAnswer()">Vérifier</button>
    <button class="secondary" onclick="nextWord()">Mot suivant</button>

    <div class="feedback" id="feedback"></div>

    <div class="stats" id="stats"></div>
  </div>

  <script>
    const lexicon = [
      {
        fr: "la mer",
        answer: "ἡ θάλασσα, θαλάσσης"
      },
      {
        fr: "le fleuve",
        answer: "ὁ ποταμός, ποταμοῦ"
      },
      {
        fr: "le cheval",
        answer: "ὁ ἵππος, ἵππου"
      },
      {
        fr: "le lion",
        answer: "ὁ λέων, λέοντος"
      },
      {
        fr: "le loup",
        answer: "ὁ λύκος, λύκου"
      },
      {
        fr: "le taureau",
        answer: "ὁ ταῦρος, ταύρου"
      },
      {
        fr: "l'eau",
        answer: "τὸ ὕδωρ, ὕδατος"
      },
      {
        fr: "la ville",
        answer: "ἡ πόλις, πόλεως"
      },
      {
        fr: "le cygne",
        answer: "ὁ κύκνος, κύκνου"
      },
      {
        fr: "le chien",
        answer: "ὁ κύων, κυνός"
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let attempts = 0;

    function normalize(text) {
      return text
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ")
        .replace(/;/g, ",");
    }

    function showWord() {
      document.getElementById("question").textContent =
        lexicon[currentIndex].fr;

      document.getElementById("answer").value = "";
      document.getElementById("feedback").innerHTML = "";
      document.getElementById("answer").focus();

      updateStats();
    }

    function checkAnswer() {
      const userAnswer = normalize(
        document.getElementById("answer").value
      );

      const expected = normalize(
        lexicon[currentIndex].answer
      );

      attempts++;

      if (userAnswer === expected) {
        score++;

        document.getElementById("feedback").innerHTML =
          `<div class="correct">✓ Bonne réponse</div>`;
      } else {
        document.getElementById("feedback").innerHTML =
          `
          <div class="wrong">✗ À revoir</div>
          <div>Réponse attendue :</div>
          <div><strong>${lexicon[currentIndex].answer}</strong></div>
          `;
      }

      updateStats();
    }

    function nextWord() {
      currentIndex = Math.floor(Math.random() * lexicon.length);
      showWord();
    }

    function updateStats() {
      document.getElementById("stats").textContent =
        `Score : ${score} / ${attempts}`;
    }

    document.getElementById("answer")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          checkAnswer();
        }
      });

    showWord();
  </script>
</body>
</html>
