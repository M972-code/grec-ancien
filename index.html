<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon grec ancien</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .app {
      max-width: 520px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin-top: 0;
    }

    .instruction {
      color: #666;
      font-size: 14px;
      line-height: 1.4;
    }

    .question {
      margin: 35px 0 20px;
      font-size: 32px;
      font-weight: 700;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 23px;
      border-radius: 12px;
      border: 1px solid #bbb;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      margin-bottom: 10px;
      cursor: pointer;
    }

    button.secondary {
      background: #e5e5ea;
      color: #111;
    }

    .feedback {
      margin-top: 20px;
      line-height: 1.7;
      font-size: 18px;
    }

    .correct {
      color: #16803c;
      font-weight: 600;
    }

    .wrong {
      color: #b42318;
      font-weight: 600;
    }

    .correction {
      margin-top: 15px;
      padding: 15px;
      background: #f5f5f7;
      border-radius: 12px;
      font-size: 21px;
    }

    .stats {
      border-top: 1px solid #eee;
      margin-top: 25px;
      padding-top: 15px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Grec ancien</h1>

  <div class="instruction">
    Écris : article + mot grec + terminaison du génitif.<br>
    Exemple : ἡ θάλασσα, ης
  </div>

  <div class="question" id="question"></div>

  <input
    id="answer"
    type="text"
    placeholder="ἡ θάλασσα, ης"
    autocomplete="off"
    autocapitalize="none"
    spellcheck="false"
  >

  <button onclick="checkAnswer()">Vérifier</button>

  <button class="secondary" onclick="nextWord()">
    Mot suivant
  </button>

  <div class="feedback" id="feedback"></div>

  <div class="stats" id="stats"></div>

</div>

<script>

/*
  NOTRE LEXIQUE

  Pour chaque nom :
  fr = traduction française
  article = article grec
  word = nominatif
  genitive = terminaison du génitif

  Pour le moment nous mettons seulement un mot test.
  Nous remplirons ensuite automatiquement ce tableau
  à partir de tes chapitres.
*/

const lexicon = [

  {
    fr: "la mer",
    article: "ἡ",
    word: "θάλασσα",
    genitive: "ης"
  }

];


let currentIndex = 0;
let score = 0;
let attempts = 0;


/*
  Ignore uniquement les esprits.

  Les accents restent présents et sont donc contrôlés.
*/
function removeBreathingMarks(text) {

  return text
    .normalize("NFD")

    // esprit doux
    .replace(/\u0313/g, "")

    // esprit rude
    .replace(/\u0314/g, "")

    .normalize("NFC");
}


/*
  Nettoyage général :
  - espaces
  - minuscules
  - esprits ignorés
*/
function normalize(text) {

  return removeBreathingMarks(text)
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");
}


/*
  Analyse une réponse du type :

  ἡ θάλασσα, ης
*/
function parseAnswer(text) {

  const parts = text.split(",");

  if (parts.length < 2) {
    return null;
  }

  const firstPart = parts[0].trim();
  const genitive = parts.slice(1).join(",").trim();

  const words = firstPart.split(/\s+/);

  if (words.length < 2) {
    return null;
  }

  const article = words[0];

  const word = words
    .slice(1)
    .join(" ");

  return {
    article: article,
    word: word,
    genitive: genitive
  };
}


function showWord() {

  const current = lexicon[currentIndex];

  document.getElementById("question").textContent =
    current.fr;

  document.getElementById("answer").value = "";

  document.getElementById("feedback").innerHTML = "";

  updateStats();

  document.getElementById("answer").focus();
}


function checkAnswer() {

  const current = lexicon[currentIndex];

  const rawAnswer =
    document.getElementById("answer").value;

  const user = parseAnswer(rawAnswer);

  if (!user) {

    document.getElementById("feedback").innerHTML =
      `
      <div class="wrong">
        Je n'arrive pas à lire la réponse.
      </div>

      Écris-la sous cette forme :

      <div class="correction">
        ἡ θάλασσα, ης
      </div>
      `;

    return;
  }


  const articleOK =
    normalize(user.article) ===
    normalize(current.article);

  const wordOK =
    normalize(user.word) ===
    normalize(current.word);

  const genitiveOK =
    normalize(user.genitive) ===
    normalize(current.genitive);


  attempts++;


  let html = "";


  if (articleOK) {
    html +=
      `<div class="correct">✓ Article</div>`;
  } else {
    html +=
      `<div class="wrong">
        ✗ Article
      </div>`;
  }


  if (wordOK) {
    html +=
      `<div class="correct">
        ✓ Nominatif
      </div>`;
  } else {
    html +=
      `<div class="wrong">
        ✗ Nominatif
      </div>`;
  }


  if (genitiveOK) {
    html +=
      `<div class="correct">
        ✓ Génitif
      </div>`;
  } else {
    html +=
      `<div class="wrong">
        ✗ Génitif
      </div>`;
  }


  if (
    articleOK &&
    wordOK &&
    genitiveOK
  ) {

    score++;

    html =
      `
      <div class="correct">
        ✓ Bonne réponse !
      </div>
      ` + html;

  } else {

    html +=
      `
      <div class="correction">

        Réponse attendue :<br>

        <strong>
        ${current.article}
        ${current.word},
        ${current.genitive}
        </strong>

      </div>
      `;
  }


  document.getElementById("feedback").innerHTML =
    html;

  updateStats();
}


function nextWord() {

  /*
    Pour l'instant il n'y a qu'un mot.
    Dès que nous aurons plusieurs mots,
    ce système les choisira au hasard.
  */

  if (lexicon.length > 1) {

    let newIndex;

    do {

      newIndex =
        Math.floor(
          Math.random() * lexicon.length
        );

    }
    while (
      newIndex === currentIndex &&
      lexicon.length > 1
    );

    currentIndex = newIndex;
  }

  showWord();
}


function updateStats() {

  let percentage = 0;

  if (attempts > 0) {
    percentage =
      Math.round(
        (score / attempts) * 100
      );
  }

  document.getElementById("stats").textContent =
    `Score : ${score}/${attempts} — ${percentage}%`;
}


/*
  Touche Entrée = Vérifier
*/
document
  .getElementById("answer")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        checkAnswer();
      }

    }
  );


showWord();

</script>

</body>
</html>
