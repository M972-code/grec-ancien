.wrong {

.stats {

/* =====================================================
   NORMALISATION

   On enlève :
   - accent aigu
   - accent grave
   - circonflexe

   On CONSERVE :
   - esprit doux
   - esprit rude
   - iota souscrit
   - tréma

   Donc les accents sont facultatifs,
   mais les esprits restent obligatoires.
   ===================================================== */

function normalizeGreek(text) {

  let s = text
    .normalize("NFD");

  s = s.replace(
    /[\u0300\u0301\u0340\u0341\u0342]/g,
    ""
  );

  s = s
    .normalize("NFC")
    .toLowerCase()

    /* ponctuation facultative */
    .replace(/[,\.;·]/g, " ")

    /* tirets facultatifs */
    .replace(/[-–—]/g, " ")

    .replace(/\s+/g, " ")
    .trim();

  return s;
}


/* =====================================================
   PROGRESSION PAR MOT
   ===================================================== */

function wordStats(id) {

  if (!saved.words[id]) {

    saved.words[id] = {
      correct: 0,
      wrong: 0,
      skipped: 0
    };

  }

  return saved.words[id];
}


/* =====================================================
   POIDS DE RÉVISION
   ===================================================== */

function getWeight(item) {

  const s = wordStats(item.id);

  /*
    Noms propres :
    environ 4 à 5 fois moins fréquents.
  */

  let base =
    item.type === "proper"
      ? 0.22
      : 1;


  /*
    Erreur = mot plus fréquent.
    Je passe = encore plus fréquent.
  */

  let difficulty =
    1
    + (s.wrong * 1.8)
    + (s.skipped * 3);


  /*
    Plusieurs bonnes réponses
    diminuent progressivement la fréquence.
  */

  let mastery =
    1 + (s.correct * 0.5);


  let weight =
    base * difficulty / mastery;


  /*
    On évite de revoir immédiatement
    les tout derniers mots.
  */

  if (recentIds.includes(item.id)) {
    weight *= 0.18;
  }


  /*
    Un mot très difficile reste quand même
    susceptible de revenir rapidement.
  */

  return Math.max(weight, 0.03);
}


/* =====================================================
   TIRAGE PONDÉRÉ
   ===================================================== */

function chooseWord() {

  const weights =
    lexicon.map(getWeight);

  const total =
    weights.reduce(
      (a,b) => a+b,
      0
    );

  let r =
    Math.random() * total;

  for (let i = 0; i < lexicon.length; i++) {

    r -= weights[i];

    if (r <= 0) {
      return lexicon[i];
    }

  }

  return lexicon[0];
}

   ===================================================== */

  switch(type) {

    case "noun":
      return "Nom";

    case "proper":
      return "Nom propre";

    case "adjective":
      return "Adjectif";

    case "verb":
      return "Verbe";

    case "adverb":
      return "Adverbe";

    case "conjunction":
      return "Conjonction";

    default:
      return "";

  }

}

}

/* =====================================================
   ANALYSE D'UN NOM

   Exemple :

   ὁ ἱππος ἱππου
   ===================================================== */

function parseNoun(text) {

  const parts =
    text
      .trim()
      .replace(/\s+/g," ")
      .split(" ");

  if (parts.length !== 3) {
    return null;
  }

  return {
    article: parts[0],
    word: parts[1],
    genitive: parts[2]
  };
}

   ACTION PRINCIPALE
   ===================================================== */

  if (answered) {
    showWord();

  else {

}

      <div class="wrong">
      Écris :
      article + nominatif + génitif complet
      </div>
      `;

    return;
  }


  if (selectedDeclension === null) {

    document
      .getElementById("feedback")
      .innerHTML =
      `
      <div class="wrong">
      Choisis aussi la déclinaison.
      </div>
      `;

    return;
  }


  const articleOK =
    normalizeGreek(user.article)
    ===
    normalizeGreek(current.article);

  const wordOK =
    normalizeGreek(user.word)
    ===
    normalizeGreek(current.word);

  const genitiveOK =
    normalizeGreek(user.genitive)
    ===
    normalizeGreek(current.genitive);

  const declensionOK =
    selectedDeclension
    ===
    current.declension;


  const everythingOK =
    articleOK
    &&
    wordOK
    &&
    genitiveOK
    &&
    declensionOK;


  answered = true;

  let html = "";


  html += articleOK
    ? `<div class="correct">✓ Article</div>`
    : `<div class="wrong">✗ Article</div>`;


  html += wordOK
    ? `<div class="correct">✓ Nominatif</div>`
    : `<div class="wrong">✗ Nominatif</div>`;


  html += genitiveOK
    ? `<div class="correct">✓ Génitif</div>`
    : `<div class="wrong">✗ Génitif</div>`;


  html += declensionOK
    ? `<div class="correct">
       ✓ ${current.declension}e déclinaison
       </div>`
    : `<div class="wrong">
       ✗ Déclinaison
       </div>`;


  const ws =
    wordStats(current.id);


  if (everythingOK) {

    ws.correct++;
    saved.stats.correct++;

    html =
      `<div class="correct">
       ✓ Bonne réponse !
       </div><br>`
       + html;

  }

  else {

    ws.wrong++;
    saved.stats.wrong++;

    html +=
      `
      <div class="correction">

      <strong>
      ${current.article}
      ${current.word}
      ${current.genitive}
      </strong>

      <br>

      ${current.declension}e déclinaison

      </div>
      `;

  }


  finishQuestion(html);
}


/* =====================================================
   VERBES / ADJECTIFS / ETC.
   ===================================================== */

function checkSimple() {

  const user =
    normalizeGreek(
      document
        .getElementById("answer")
        .value
    );

  if (!user) {
    return;
  }


  const correct =
    user
    ===
    normalizeGreek(current.answer);


  answered = true;

  const ws =
    wordStats(current.id);

  let html;


  if (correct) {

    ws.correct++;
    saved.stats.correct++;

    html =
      `
      <div class="correct">
      ✓ Bonne réponse !
      </div>
      `;

  }

  else {

    ws.wrong++;
    saved.stats.wrong++;

    html =
      `
      <div class="wrong">
      ✗ À revoir
      </div>

      <div class="correction">
      <strong>
      ${current.answer}
      </strong>
      </div>
      `;

  }


  finishQuestion(html);
}


/* =====================================================
   JE PASSE
   ===================================================== */

function skipWord() {

  if (answered) {
    return;
  }

  answered = true;

  const ws =
    wordStats(current.id);

  ws.skipped++;
  saved.stats.skipped++;


  let answer;


  if (
    current.type === "noun"
    ||
    current.type === "proper"
  ) {

    answer =
      `
      ${current.article}
      ${current.word}
      ${current.genitive}
      <br>
      ${current.declension}e déclinaison
      `;

  }

  else {

    answer =
      current.answer;

  }


  const html =
    `
    <div class="correction">

    <strong>
    ${answer}
    </strong>

    </div>
    `;


  finishQuestion(html);
}


/* =====================================================
   FIN DE QUESTION
   ===================================================== */

function finishQuestion(html) {

  document
    .getElementById("feedback")
    .innerHTML =
    html;

  document
    .getElementById("mainButton")
    .textContent =
    "Mot suivant";

  document
    .getElementById("skipButton")
    .style.display =
    "none";

  saveProgress();
  updateStats();
}


/* =====================================================
   STATISTIQUES
   ===================================================== */

function updateStats() {

  const total =
    saved.stats.correct
    +
    saved.stats.wrong
    +
    saved.stats.skipped;


  let success = 0;

  if (total > 0) {

    success =
      Math.round(
        saved.stats.correct
        /
        total
        *
        100
      );

  }


  document
    .getElementById("stats")
    .textContent =

    `${saved.stats.correct} réussis · `
    +
    `${saved.stats.wrong} erreurs · `
    +
    `${saved.stats.skipped} passés · `
    +
    `${success}%`;

}


/* =====================================================
   TOUCHE ENTRÉE
   ===================================================== */

document
  .getElementById("answer")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        mainAction();
      }

    }
  );


showWord();

</script>
