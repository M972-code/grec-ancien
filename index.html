<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Révision grec ancien</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .app {
      max-width: 520px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .instruction {
      color: #666;
      font-size: 15px;
      line-height: 1.5;
    }

    .question {
      margin: 35px 0 20px;
      font-size: 34px;
      font-weight: 700;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      font-size: 24px;
      border-radius: 12px;
      border: 1px solid #bbb;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      margin-bottom: 10px;
    }

    button.secondary {
      background: #e5e5ea;
      color: #111;
    }

    .feedback {
      margin-top: 20px;
      line-height: 1.7;
      font-size: 18px;
    }

    .correct {
      color: #16803c;
      font-weight: 600;
    }

    .wrong {
      color: #b42318;
      font-weight: 600;
    }

    .correction {
      margin-top: 14px;
      padding: 15px;
      background: #f5f5f7;
      border-radius: 12px;
      font-size: 22px;
    }

    .stats {
      border-top: 1px solid #eee;
      margin-top: 25px;
      padding-top: 15px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Grec ancien</h1>

  <div class="instruction">
    Écris : <strong>article + nominatif + terminaison du génitif</strong><br>
    Exemple : <strong>ἡ θάλασσα ης</strong><br><br>

    Les esprits sont obligatoires.<br>
    Les accents ne sont pas pris en compte.
  </div>

  <div class="question" id="question"></div>

  <input
    id="answer"
    type="text"
    placeholder="Réponse en grec"
    autocomplete="off"
    autocapitalize="none"
    spellcheck="false"
  >

  <button onclick="checkAnswer()">Vérifier</button>

  <button class="secondary" onclick="nextWord()">
    Mot suivant
  </button>

  <div class="feedback" id="feedback"></div>

  <div class="stats" id="stats"></div>

</div>

<script>

/*
  LEXIQUE DU CHAPITRE TEST

  answerGenitive = terminaison que tu dois réciter.
  fullGenitive = forme complète affichée dans la correction.
*/

const lexicon = [

  {
    fr: "la mer",
    article: "ἡ",
    word: "θάλασσα",
    answerGenitive: "ης",
    fullGenitive: "θαλάσσης"
  },

  {
    fr: "le cheval",
    article: "ὁ",
    word: "ἵππος",
    answerGenitive: "ου",
    fullGenitive: "ἵππου"
  },

  {
    fr: "le lion",
    article: "ὁ",
    word: "λέων",
    answerGenitive: "οντος",
    fullGenitive: "λέοντος"
  },

  {
    fr: "le loup",
    article: "ὁ",
    word: "λύκος",
    answerGenitive: "ου",
    fullGenitive: "λύκου"
  },

  {
    fr: "le taureau",
    article: "ὁ",
    word: "ταῦρος",
    answerGenitive: "ου",
    fullGenitive: "ταύρου"
  },

  {
    fr: "l'eau",
    article: "τό",
    word: "ὕδωρ",
    answerGenitive: "ατος",
    fullGenitive: "ὕδατος"
  },

  {
    fr: "la ville",
    article: "ἡ",
    word: "πόλις",
    answerGenitive: "εως",
    fullGenitive: "πόλεως"
  },

  {
    fr: "le cygne",
    article: "ὁ",
    word: "κύκνος",
    answerGenitive: "ου",
    fullGenitive: "κύκνου"
  },

  {
    fr: "le chien",
    article: "ὁ",
    word: "κύων",
    answerGenitive: "υνος",
    fullGenitive: "κυνός"
  }

];


let currentIndex = Math.floor(Math.random() * lexicon.length);
let score = 0;
let attempts = 0;
let answered = false;


/*
  Supprime UNIQUEMENT les accents.

  On conserve les esprits :
  ἀ et ἁ restent différents.

  Donc :
  ἵππος = ἱππος pour l'application
  mais
  ἵππος ≠ ἰππος
*/
function removeAccents(text) {

  return text
    .normalize("NFD")

    // accent grave
    .replace(/\u0300/g, "")

    // accent aigu
    .replace(/\u0301/g, "")

    // circonflexe grec / périspomène
    .replace(/\u0342/g, "")

    // anciennes variantes Unicode d'accents grecs
    .replace(/\u0340/g, "")
    .replace(/\u0341/g, "")

    .normalize("NFC");
}


function normalize(text) {

  return removeAccents(text)
    .trim()
    .toLowerCase()
    .replace(/[,.·;]/g, "")
    .replace(/\s+/g, " ");
}


/*
  Format attendu :

  ἡ θάλασσα ης

  premier élément = article
  dernier élément = génitif
  tout ce qui est au milieu = nominatif
*/
function parseAnswer(text) {

  const clean = text
    .trim()
    .replace(/[,.·;]/g, " ")
    .replace(/\s+/g, " ");

  const parts = clean.split(" ");

  if (parts.length < 3) {
    return null;
  }

  return {
    article: parts[0],
    word: parts.slice(1, -1).join(" "),
    genitive: parts[parts.length - 1]
  };
}


function showWord() {

  const current = lexicon[currentIndex];

  document.getElementById("question").textContent =
    current.fr;

  document.getElementById("answer").value = "";

  document.getElementById("feedback").innerHTML = "";

  answered = false;

  updateStats();

  document.getElementById("answer").focus();
}


function checkAnswer() {

  if (answered) {
    return;
  }

  const current = lexicon[currentIndex];

  const raw =
    document.getElementById("answer").value;

  const user = parseAnswer(raw);


  if (!user) {

    document.getElementById("feedback").innerHTML =
      `
      <div class="wrong">
        Je n'arrive pas à lire la réponse.
      </div>

      Écris trois éléments séparés par des espaces :

      <div class="correction">
        ἡ θάλασσα ης
      </div>
      `;

    return;
  }


  const articleOK =
    normalize(user.article) ===
    normalize(current.article);

  const wordOK =
    normalize(user.word) ===
    normalize(current.word);

  const genitiveOK =
    normalize(user.genitive) ===
    normalize(current.answerGenitive);


  attempts++;
  answered = true;

  let html = "";


  if (articleOK) {
    html += `<div class="correct">✓ Article</div>`;
  } else {
    html += `<div class="wrong">✗ Article</div>`;
  }


  if (wordOK) {
    html += `<div class="correct">✓ Nominatif</div>`;
  } else {
    html += `<div class="wrong">✗ Nominatif</div>`;
  }


  if (genitiveOK) {
    html += `<div class="correct">✓ Génitif</div>`;
  } else {
    html += `<div class="wrong">✗ Génitif</div>`;
  }


  if (articleOK && wordOK && genitiveOK) {

    score++;

    html =
      `<div class="correct">
        ✓ Bonne réponse !
      </div><br>` + html;

  }

  else {

    html +=
      `
      <div class="correction">

        Réponse attendue :<br>

        <strong>
          ${current.article}
          ${current.word}
          ${current.answerGenitive}
        </strong>

        <br><br>

        Génitif complet :
        <strong>${current.fullGenitive}</strong>

      </div>
      `;
  }


  document.getElementById("feedback").innerHTML =
    html;

  updateStats();
}


function nextWord() {

  let newIndex;

  do {

    newIndex =
      Math.floor(
        Math.random() * lexicon.length
      );

  }
  while (
    newIndex === currentIndex &&
    lexicon.length > 1
  );

  currentIndex = newIndex;

  showWord();
}


function updateStats() {

  const percentage =
    attempts === 0
      ? 0
      : Math.round((score / attempts) * 100);

  document.getElementById("stats").textContent =
    `Score : ${score}/${attempts} — ${percentage}%`;
}


/*
  Entrée = vérifier
*/
document
  .getElementById("answer")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        checkAnswer();
      }

    }
  );


showWord();

</script>

</body>
</html>
