<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Révision grec ancien</title>

<style>

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  padding: 20px;
  background: #f5f5f7;
  color: #1d1d1f;
}

.app {
  max-width: 520px;
  margin: 20px auto;
  background: white;
  padding: 24px;
  border-radius: 20px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
  margin-top: 0;
}

.instruction {
  color: #666;
  line-height: 1.5;
}

.question {
  margin: 30px 0 20px;
  font-size: 34px;
  font-weight: 700;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 16px;
  font-size: 24px;
  border-radius: 12px;
  border: 1px solid #bbb;
  margin-bottom: 15px;
}

.declensions {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}

.declensions button {
  background: #e5e5ea;
  color: #111;
  font-size: 16px;
  padding: 12px 5px;
}

.declensions button.selected {
  background: #007aff;
  color: white;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 18px;
  margin-bottom: 10px;
  background: #007aff;
  color: white;
}

button.secondary {
  background: #e5e5ea;
  color: #111;
}

.feedback {
  margin-top: 20px;
  line-height: 1.7;
  font-size: 18px;
}

.correct {
  color: #16803c;
  font-weight: 600;
}

.wrong {
  color: #b42318;
  font-weight: 600;
}

.correction {
  margin-top: 15px;
  background: #f5f5f7;
  border-radius: 12px;
  padding: 15px;
  font-size: 20px;
}

.stats {
  margin-top: 25px;
  padding-top: 15px;
  border-top: 1px solid #eee;
  color: #666;
}

</style>
</head>

<body>

<div class="app">

<h1>Grec ancien</h1>

<div class="instruction">

Pour un nom, écris :

<strong>article + nominatif + terminaison du génitif</strong>

<br><br>

Exemple :<br>
<strong>ὁ ἱππος ου</strong>

<br><br>

Puis choisis sa déclinaison.

<br><br>

✓ Esprits obligatoires<br>
✓ Accents facultatifs<br>
✓ Pas de virgule

</div>


<div id="question" class="question"></div>


<input
id="answer"
type="text"
placeholder="ὁ ἱππος ου"
autocomplete="off"
autocapitalize="none"
spellcheck="false"
>


<div class="declensions">

<button
id="decl1"
onclick="selectDeclension(1)">
1re
</button>

<button
id="decl2"
onclick="selectDeclension(2)">
2e
</button>

<button
id="decl3"
onclick="selectDeclension(3)">
3e
</button>

</div>


<button onclick="checkAnswer()">
Vérifier
</button>

<button
class="secondary"
onclick="nextWord()">
Mot suivant
</button>


<div
id="feedback"
class="feedback">
</div>

<div
id="stats"
class="stats">
</div>

</div>


<script>

/* ===========================
   LEXIQUE
   =========================== */

const lexicon = [

{
  fr: "la mer",
  article: "ἡ",
  word: "θάλασσα",
  genitive: "ης",
  fullGenitive: "θαλάσσης",
  declension: 1
},

{
  fr: "le cheval",
  article: "ὁ",
  word: "ἵππος",
  genitive: "ου",
  fullGenitive: "ἵππου",
  declension: 2
},

{
  fr: "le lion",
  article: "ὁ",
  word: "λέων",
  genitive: "οντος",
  fullGenitive: "λέοντος",
  declension: 3
},

{
  fr: "le loup",
  article: "ὁ",
  word: "λύκος",
  genitive: "ου",
  fullGenitive: "λύκου",
  declension: 2
},

{
  fr: "le taureau",
  article: "ὁ",
  word: "ταῦρος",
  genitive: "ου",
  fullGenitive: "ταύρου",
  declension: 2
},

{
  fr: "l'eau",
  article: "τό",
  word: "ὕδωρ",
  genitive: "ατος",
  fullGenitive: "ὕδατος",
  declension: 3
},

{
  fr: "la ville",
  article: "ἡ",
  word: "πόλις",
  genitive: "εως",
  fullGenitive: "πόλεως",
  declension: 3
},

{
  fr: "le cygne",
  article: "ὁ",
  word: "κύκνος",
  genitive: "ου",
  fullGenitive: "κύκνου",
  declension: 2
},

{
  fr: "le chien",
  article: "ὁ",
  word: "κύων",
  genitive: "ος",
  fullGenitive: "κυνός",
  declension: 3
}

];


/* ===========================
   ÉTAT
   =========================== */

let currentIndex =
  Math.floor(Math.random() * lexicon.length);

let selectedDeclension = null;

let score = 0;
let attempts = 0;

let answered = false;



/* ===========================
   NORMALISATION DU GREC

   IMPORTANT :

   on SUPPRIME les accents

   mais on CONSERVE :
   esprit doux
   esprit rude

   Ainsi :

   ἵππος -> ἱππος

   mais

   ἵππος n'est PAS équivalent
   à ἴππος
   =========================== */

function normalizeGreek(text) {

  let chars =
    text.normalize("NFD");

  chars = chars.replace(
    /[\u0300\u0301\u0340\u0341\u0342]/g,
    ""
  );

  return chars
    .normalize("NFC")
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ");

}


/* ===========================
   ANALYSE DE LA RÉPONSE

   Format :

   ὁ ἱππος ου

   PAS DE VIRGULE
   =========================== */

function parseAnswer(text) {

  const cleaned = text
    .trim()
    .replace(/\s+/g, " ");

  const parts =
    cleaned.split(" ");

  if (parts.length !== 3) {
    return null;
  }

  return {

    article: parts[0],

    word: parts[1],

    genitive: parts[2]

  };

}


/* ===========================
   CHOIX DÉCLINAISON
   =========================== */

function selectDeclension(number) {

  selectedDeclension = number;

  for (let i = 1; i <= 3; i++) {

    document
      .getElementById("decl" + i)
      .classList.remove("selected");

  }

  document
    .getElementById("decl" + number)
    .classList.add("selected");

}


/* ===========================
   AFFICHER UN MOT
   =========================== */

function showWord() {

  const current =
    lexicon[currentIndex];

  document
    .getElementById("question")
    .textContent =
    current.fr;

  document
    .getElementById("answer")
    .value = "";

  document
    .getElementById("feedback")
    .innerHTML = "";

  selectedDeclension = null;

  answered = false;

  for (let i = 1; i <= 3; i++) {

    document
      .getElementById("decl" + i)
      .classList.remove("selected");

  }

  document
    .getElementById("answer")
    .focus();

}


/* ===========================
   VÉRIFICATION
   =========================== */

function checkAnswer() {

  if (answered) {
    return;
  }

  const current =
    lexicon[currentIndex];

  const user =
    parseAnswer(
      document
        .getElementById("answer")
        .value
    );


  if (!user) {

    document
      .getElementById("feedback")
      .innerHTML =

      `
      <div class="wrong">
      Réponse non reconnue.
      </div>

      Écris simplement trois éléments :

      <div class="correction">
      article nominatif génitif
      <br>
      par exemple :
      <strong>ὁ ἱππος ου</strong>
      </div>
      `;

    return;

  }


  if (selectedDeclension === null) {

    document
      .getElementById("feedback")
      .innerHTML =

      `
      <div class="wrong">
      Choisis aussi la déclinaison :
      1re, 2e ou 3e.
      </div>
      `;

    return;

  }


  const articleOK =

    normalizeGreek(user.article)
    ===
    normalizeGreek(current.article);


  const wordOK =

    normalizeGreek(user.word)
    ===
    normalizeGreek(current.word);


  const genitiveOK =

    normalizeGreek(user.genitive)
    ===
    normalizeGreek(current.genitive);


  const declensionOK =

    selectedDeclension
    ===
    current.declension;


  attempts++;

  answered = true;


  let html = "";


  html += articleOK

    ? `<div class="correct">✓ Article</div>`

    : `<div class="wrong">✗ Article</div>`;


  html += wordOK

    ? `<div class="correct">✓ Nominatif</div>`

    : `<div class="wrong">✗ Nominatif</div>`;


  html += genitiveOK

    ? `<div class="correct">✓ Génitif</div>`

    : `<div class="wrong">✗ Génitif</div>`;


  html += declensionOK

    ? `<div class="correct">
       ✓ ${current.declension}e déclinaison
       </div>`

    : `<div class="wrong">
       ✗ Déclinaison
       </div>`;


  const everythingOK =

    articleOK &&
    wordOK &&
    genitiveOK &&
    declensionOK;


  if (everythingOK) {

    score++;

    html =
      `<div class="correct">
      ✓ Bonne réponse !
      </div><br>`
      + html;

  }

  else {

    html +=

      `
      <div class="correction">

      Réponse attendue :

      <br><br>

      <strong>
      ${current.article}
      ${current.word}
      ${current.genitive}
      </strong>

      <br><br>

      Génitif complet :
      <strong>
      ${current.fullGenitive}
      </strong>

      <br>

      Déclinaison :
      <strong>
      ${current.declension}e
      </strong>

      </div>
      `;

  }


  document
    .getElementById("feedback")
    .innerHTML =
    html;


  updateStats();

}


/* ===========================
   MOT SUIVANT
   =========================== */

function nextWord() {

  let newIndex;

  do {

    newIndex =
      Math.floor(
        Math.random()
        *
        lexicon.length
      );

  }

  while (
    newIndex === currentIndex
    &&
    lexicon.length > 1
  );


  currentIndex =
    newIndex;


  showWord();

}


/* ===========================
   SCORE
   =========================== */

function updateStats() {

  let percentage = 0;

  if (attempts > 0) {

    percentage =
      Math.round(
        score
        /
        attempts
        *
        100
      );

  }


  document
    .getElementById("stats")
    .textContent =

    `Score : ${score}/${attempts} — ${percentage}%`;

}


/* touche Entrée */

document
  .getElementById("answer")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        checkAnswer();
      }

    }
  );


showWord();
updateStats();

</script>

</body>
</html>
