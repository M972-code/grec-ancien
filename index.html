<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grec</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:8px;background:#f5f5f7;color:#1d1d1f}
.app{max-width:520px;margin:0 auto;background:white;padding:10px 14px;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
.top{display:flex;gap:8px;align-items:center;margin-bottom:4px}
select{font-size:13px;padding:6px;border-radius:8px;border:1px solid #ccc;background:white}
.category{font-size:12px;color:#777;flex:1}
.question{margin:4px 0 12px;font-size:30px;font-weight:700}
input{width:100%;box-sizing:border-box;padding:12px;font-size:22px;border-radius:11px;border:1px solid #bbb;margin-bottom:9px}
.declensions,.cases{display:flex;gap:7px;margin-bottom:9px}
.declensions button,.cases button{flex:1;background:#e5e5ea;color:#111;padding:9px}
.declensions button.selected,.cases button.selected{background:#007aff;color:white}
button{width:100%;border:none;border-radius:11px;padding:11px;font-size:17px;margin-bottom:7px;background:#007aff;color:white}
button.skip{background:#e5e5ea;color:#333}
.feedback{margin-top:8px;line-height:1.45;font-size:16px}
.correct{color:#16803c;font-weight:600} .wrong{color:#b42318;font-weight:600}
.correction{margin-top:8px;background:#f5f5f7;border-radius:10px;padding:10px;font-size:18px}
.stats{margin-top:8px;padding-top:7px;border-top:1px solid #eee;color:#777;font-size:12px}
</style>
</head>
<body>
<div class="app">
<div class="top">
  <div id="category" class="category"></div>

    <option value="Ε">Ε</option><option value="Ζ">Ζ</option><option value="Θ">Θ</option><option value="Ι">Ι</option><option value="ΙΑ">ΙΑ</option>
  </select>
</div>
<div id="question" class="question"></div>
<input id="answer" type="text" placeholder="Réponse en grec" autocomplete="off" autocapitalize="none" spellcheck="false">
<div id="declensions" class="declensions">
<button id="decl1" onclick="selectDeclension(1)">1re</button>
<button id="decl2" onclick="selectDeclension(2)">2e</button>
<button id="decl3" onclick="selectDeclension(3)">3e</button>
</div>
<div id="cases" class="cases" style="display:none">
<button id="casegen" onclick="toggleCase('gen')">+ gén.</button>
<button id="casedat" onclick="toggleCase('dat')">+ dat.</button>
<button id="caseacc" onclick="toggleCase('acc')">+ acc.</button>
</div>
<button id="mainButton" onclick="mainAction()">Vérifier</button>
<button id="skipButton" class="skip" onclick="skipWord()">Je passe</button>
<div id="feedback" class="feedback"></div>
<div id="stats" class="stats"></div>
</div>

const STORAGE_KEY="grecAncienMultiChaptersV2";
let saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
if(!saved.words)saved.words={};
if(!saved.stats)saved.stats={correct:0,wrong:0,skipped:0};
let current=null,selectedDeclension=null,selectedCases=[],answered=false,recentIds=[];

function normalizeGreek(text){
 let s=text.normalize("NFD");
 s=s.replace(/[\u0300\u0301\u0340\u0341\u0342]/g,"");
 return s.normalize("NFC").toLowerCase().replace(/[,.;·]/g," ").replace(/[-–—]/g," ").replace(/\s+/g," ").trim();
}
function wordStats(id){if(!saved.words[id])saved.words[id]={correct:0,wrong:0,skipped:0};return saved.words[id]}
function saveProgress(){localStorage.setItem(STORAGE_KEY,JSON.stringify(saved))}
function activeLexicon(){
 const f=document.getElementById("chapterFilter").value;
 return f==="ALL"?lexicon:lexicon.filter(x=>x.chapter===f);
}
function getWeight(item){
 const s=wordStats(item.id);
 let base=item.type==="proper"?0.18:1;
 let difficulty=1+s.wrong*1.8+s.skipped*3;
 let mastery=1+s.correct*0.5;
 let w=base*difficulty/mastery;
 if(recentIds.includes(item.id))w*=0.16;
 return Math.max(w,0.03);
}
function chooseWord(){
 const pool=activeLexicon(); if(!pool.length)return null;
 const weights=pool.map(getWeight),total=weights.reduce((a,b)=>a+b,0);
 let r=Math.random()*total;
 for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
 return pool[0];
}
function categoryName(t){
 return {noun:"Nom",proper:"Nom propre",adjective:"Adjectif",verb:"Verbe",adverb:"Adverbe",conjunction:"Conjonction",
 pronoun:"Pronom",article:"Article",particle:"Particule",number:"Nombre",preposition:"Préposition",phrase:"Expression",interjection:"Interjection"}[t]||"";
}
function showWord(){
 current=chooseWord(); if(!current)return;
 recentIds.push(current.id); if(recentIds.length>4)recentIds.shift();
 answered=false;selectedDeclension=null;selectedCases=[];
 document.getElementById("question").textContent=current.fr;
 document.getElementById("category").textContent="Chap. "+current.chapter+" · "+categoryName(current.type);
 document.getElementById("answer").value="";
 document.getElementById("feedback").innerHTML="";
 document.getElementById("mainButton").textContent="Vérifier";
 document.getElementById("skipButton").style.display="block";
 document.getElementById("declensions").style.display=current.type==="noun"?"flex":"none";
 document.getElementById("cases").style.display=current.type==="preposition"?"flex":"none";
 for(let i=1;i<=3;i++)document.getElementById("decl"+i).classList.remove("selected");
 ["gen","dat","acc"].forEach(c=>document.getElementById("case"+c).classList.remove("selected"));
 document.getElementById("answer").focus();updateStats();
}
function resetAndShow(){recentIds=[];showWord()}
function selectDeclension(n){selectedDeclension=n;for(let i=1;i<=3;i++)document.getElementById("decl"+i).classList.remove("selected");
 ["gen","dat","acc"].forEach(c=>document.getElementById("case"+c).classList.remove("selected"));document.getElementById("decl"+n).classList.add("selected")}
function parseNoun(text){
 const parts=text.trim().replace(/\s+/g," ").split(" "); if(parts.length!==3)return null;
 return {article:parts[0],word:parts[1],genitive:parts[2]};
}
function mainAction(){answered?showWord():checkAnswer()}
function checkAnswer(){if(current.type==="noun")checkNoun();else if(current.type==="preposition")checkPreposition();else checkSimple()}
function checkNoun(){
 const user=parseNoun(document.getElementById("answer").value);
 if(!user){document.getElementById("feedback").innerHTML='<div class="wrong">Écris : article + nominatif + génitif complet</div>';return}
 if(selectedDeclension===null){document.getElementById("feedback").innerHTML='<div class="wrong">Choisis aussi la déclinaison.</div>';return}
 const a=normalizeGreek(user.article)===normalizeGreek(current.article);
 const w=normalizeGreek(user.word)===normalizeGreek(current.word);
 const g=normalizeGreek(user.genitive)===normalizeGreek(current.genitive);
 const d=selectedDeclension===current.declension;
 const ok=a&&w&&g&&d; answered=true; let html="";
 html+=a?'<div class="correct">✓ Article</div>':'<div class="wrong">✗ Article</div>';
 html+=w?'<div class="correct">✓ Nominatif</div>':'<div class="wrong">✗ Nominatif</div>';
 html+=g?'<div class="correct">✓ Génitif</div>':'<div class="wrong">✗ Génitif</div>';
 html+=d?'<div class="correct">✓ '+current.declension+'e déclinaison</div>':'<div class="wrong">✗ Déclinaison</div>';
 const ws=wordStats(current.id);
 if(ok){ws.correct++;saved.stats.correct++;html='<div class="correct">✓ Bonne réponse !</div><br>'+html}
 else{ws.wrong++;saved.stats.wrong++;html+='<div class="correction"><strong>'+current.article+' '+current.word+' '+current.genitive+'</strong><br>'+current.declension+'e déclinaison</div>'}
 finishQuestion(html);
}
function checkPreposition(){
 const user=normalizeGreek(document.getElementById("answer").value);
 if(!user)return;
 if(!selectedCases.length){
   document.getElementById("feedback").innerHTML='<div class="wrong">Choisis aussi le ou les cas.</div>';
   return;
 }
 const wordOK=user===normalizeGreek(current.answer);
 const expected=(current.cases||[]).slice().sort().join(",");
 const chosen=selectedCases.slice().sort().join(",");
 const casesOK=chosen===expected;
 answered=true;
 const ws=wordStats(current.id);
 let html="";
 html+=wordOK?'<div class="correct">✓ Préposition</div>':'<div class="wrong">✗ Préposition</div>';
 html+=casesOK?'<div class="correct">✓ Cas</div>':'<div class="wrong">✗ Cas</div>';
 if(wordOK&&casesOK){
   ws.correct++;saved.stats.correct++;
   html='<div class="correct">✓ Bonne réponse !</div><br>'+html;
 } else {
   ws.wrong++;saved.stats.wrong++;
   const labels={gen:"génitif",dat:"datif",acc:"accusatif"};
   const expectedCases=(current.cases||[]).map(c=>labels[c]).join(" + ");
   html+='<div class="correction"><strong>'+current.answer+'</strong><br>Construction : <strong>'+expectedCases+'</strong></div>';
 }
 finishQuestion(html);
}
function checkSimple(){
 const user=normalizeGreek(document.getElementById("answer").value);if(!user)return;
 const ok=user===normalizeGreek(current.answer);answered=true;const ws=wordStats(current.id);let html="";
 if(ok){ws.correct++;saved.stats.correct++;html='<div class="correct">✓ Bonne réponse !</div>'}
 else{ws.wrong++;saved.stats.wrong++;html='<div class="wrong">✗ À revoir</div><div class="correction"><strong>'+current.answer+'</strong></div>'}
 finishQuestion(html);
}
function skipWord(){
 if(answered)return;answered=true;const ws=wordStats(current.id);ws.skipped++;saved.stats.skipped++;
 let ans;
 if(current.type==="noun"){
   ans=current.article+" "+current.word+" "+current.genitive+"<br>"+current.declension+"e déclinaison";
 } else if(current.type==="preposition"){
   const labels={gen:"génitif",dat:"datif",acc:"accusatif"};
   ans=current.answer+"<br>Construction : "+(current.cases||[]).map(c=>labels[c]).join(" + ");
 } else {
   ans=current.answer;
 }
 finishQuestion('<div class="correction"><strong>'+ans+'</strong></div>');
}
function finishQuestion(html){
 document.getElementById("feedback").innerHTML=html;
 document.getElementById("mainButton").textContent="Mot suivant";
 document.getElementById("skipButton").style.display="none";
 saveProgress();updateStats();
}
function updateStats(){
